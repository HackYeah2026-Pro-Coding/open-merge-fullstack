<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fair-split · receipt</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0c0e;
      --card: #14161a;
      --line: #2b2e34;
      --fg: #f2f3f5;
      --muted: #9a9ea6;
      --ok: #35c26d;
      --bad: #f44657;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.6 ui-sans-serif, system-ui, sans-serif;
    }
    .receipt {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    h1 { margin: 0; font-size: 20px; }
    .muted { color: var(--muted); font-size: 13px; }
    .inputs { display: flex; gap: 16px; margin: 16px 0; }
    label { display: grid; gap: 4px; flex: 1; font-size: 11.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
    input {
      width: 100%;
      padding: 8px 10px;
      font: 15px ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    ul { margin: 0; padding: 12px 0; list-style: none; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    li, .sum { display: flex; justify-content: space-between; padding: 4px 0; }
    .sum { margin-top: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
    .verdict { display: inline-block; margin-top: 12px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 500; }
    .verdict.ok { color: var(--ok); background: rgb(53 194 109 / 0.12); }
    .verdict.bad { color: var(--bad); background: rgb(244 70 87 / 0.12); }
  </style>
</head>
<body>
  <main class="receipt">
    <h1>Dinner at Luigi's</h1>
    <p class="muted">Split the bill between friends</p>
    <div class="inputs">
      <label>Total ($)<input id="total" type="number" step="0.01" min="0" value="100.00"></label>
      <label>People<input id="people" type="number" step="1" value="3"></label>
    </div>
    <ul id="shares"></ul>
    <div class="sum"><span>Collected</span><span id="collected"></span></div>
    <span id="verdict" class="verdict"></span>
  </main>

  <script type="module">
    import { splitBill } from '../src/splitBill.js';

    const dollars = (cents) => `$${(cents / 100).toFixed(2)}`;
    const $ = (id) => document.getElementById(id);

    function render() {
      const totalCents = Math.round(Number($('total').value) * 100);
      const people = Number($('people').value);
      const verdict = $('verdict');
      try {
        const shares = splitBill(totalCents, people);
        const collected = shares.reduce((sum, share) => sum + share, 0);
        $('shares').innerHTML = shares.map((share, i) => `<li><span>Person ${i + 1}</span><span>${dollars(share)}</span></li>`).join('');
        $('collected').textContent = dollars(collected);
        const gap = totalCents - collected;
        verdict.className = `verdict ${gap === 0 ? 'ok' : 'bad'}`;
        verdict.textContent = gap === 0 ? 'Adds up' : `${dollars(Math.abs(gap))} ${gap > 0 ? 'is missing' : 'too much'}`;
      } catch (error) {
        $('shares').innerHTML = '';
        $('collected').textContent = '';
        verdict.className = 'verdict bad';
        verdict.textContent = error.message;
      }
    }

    $('total').addEventListener('input', render);
    $('people').addEventListener('input', render);
    render();
  </script>
</body>
</html>
