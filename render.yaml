# Render Blueprint. Dashboard -> New -> Blueprint, point it at this repository.
# Everything here can also be set by hand when creating a Web Service.
services:
  - type: web
    name: escrow-api
    runtime: docker
    plan: free
    region: frankfurt
    # The build context is the repository root so the pnpm workspace resolves.
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase session-pooler URL. Set in the dashboard, never in this file.
      - key: DATABASE_URL
        sync: false
      # Origin of the deployed frontend, for CORS.
      - key: WEB_ORIGIN
        sync: false
      # Production GitHub OAuth App; its callback is <WEB_ORIGIN>/api/auth/github/callback.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Signs session cookies, min 32 chars: `openssl rand -hex 32`.
      - key: SESSION_SECRET
        sync: false
      # AI review of pull requests. The webhook secret must match the one set on the GitHub webhook.
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      # Bot account token: read repo, write issues, pull requests and commit statuses.
      - key: GITHUB_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
