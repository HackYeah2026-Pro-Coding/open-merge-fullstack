services:
  postgres:
    image: postgres:17-alpine
    container_name: escrow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: escrow
      POSTGRES_PASSWORD: escrow
      POSTGRES_DB: escrow
    ports:
      # Host port 55432 avoids clashing with a Postgres you may already run on 5432.
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escrow -d escrow"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Optional web UI for the database: `docker compose --profile tools up -d adminer`
  adminer:
    image: adminer:5
    container_name: escrow-adminer
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
